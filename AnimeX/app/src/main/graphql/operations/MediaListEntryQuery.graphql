query MediaListEntryQuery($id: Int) {
  Viewer {
    mediaListOptions {
      scoreFormat
      animeList {
        advancedScoringEnabled
        advancedScoring
        customLists
      }
    }
  }
  Media(id: $id, type: ANIME) {
    id
    episodes
    mediaListEntry {
      id
      status
      score
      progress
      repeat
      notes
      priority
      private
      hiddenFromStatusLists
      startedAt {
        year
        month
        day
      }
      completedAt {
        year
        month
        day
      }
      advancedScores
      customLists
    }
  }
}
