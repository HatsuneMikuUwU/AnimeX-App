query MediaListCollectionQuery($userId: Int, $chunk: Int, $perChunk: Int) {
  MediaListCollection(
    userId: $userId
    type: ANIME
    sort: UPDATED_TIME_DESC
    chunk: $chunk
    perChunk: $perChunk
  ) {
    hasNextChunk
    lists {
      name
      isCustomList
      entries {
        id
        status
        score
        progress
        repeat
        updatedAt
        media {
          id
          idMal
          episodes
          title {
            romaji
            english
            native
          }
          coverImage {
            large
            extraLarge
          }
        }
      }
    }
  }
}
