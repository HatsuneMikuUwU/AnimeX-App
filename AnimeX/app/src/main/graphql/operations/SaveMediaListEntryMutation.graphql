mutation SaveMediaListEntryMutation(
  $mediaId: Int
  $status: MediaListStatus
  $score: Float
  $progress: Int
  $startedAt: FuzzyDateInput
  $completedAt: FuzzyDateInput
  $repeat: Int
  $private: Boolean
  $hiddenFromStatusLists: Boolean
  $notes: String
  $advancedScores: [Float]
  $priority: Int
  $customLists: [String]
) {
  SaveMediaListEntry(
    mediaId: $mediaId
    status: $status
    score: $score
    progress: $progress
    startedAt: $startedAt
    completedAt: $completedAt
    repeat: $repeat
    private: $private
    hiddenFromStatusLists: $hiddenFromStatusLists
    notes: $notes
    advancedScores: $advancedScores
    priority: $priority
    customLists: $customLists
  ) {
    id
    status
    score
    progress
    repeat
    notes
    priority
    private
    hiddenFromStatusLists
    startedAt {
      year
      month
      day
    }
    completedAt {
      year
      month
      day
    }
    advancedScores
    customLists
  }
}
