query UserActivitiesQuery($userId: Int) {
  Page(page: 1, perPage: 50) {
    activities(userId: $userId, type: MEDIA_LIST, sort: ID_DESC) {
      ... on ListActivity {
        id
        createdAt
        status
        progress
        media {
          id
          type
          title {
            romaji
            english
            native
          }
        }
      }
    }
  }
}
