query UserActivitiesQuery($userId: Int, $page: Int, $perPage: Int) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      currentPage
      hasNextPage
    }
    activities(userId: $userId, type: MEDIA_LIST, sort: ID_DESC) {
      ... on ListActivity {
        id
        createdAt
        status
        progress
        media {
          id
          type
          title {
            romaji
            english
            native
          }
        }
      }
    }
  }
}
