fragment MediaCharactersFragment on Media {
  characters(sort: ROLE, page: 1, perPage: 50) {
    edges {
      role
      voiceActors(language: JAPANESE) {
        name {
          userPreferred
          full
          native
        }
        image {
          large
          medium
        }
      }
      node {
        id
        name {
          userPreferred
          full
          native
        }
        image {
          large
          medium
        }
      }
    }
  }
}
