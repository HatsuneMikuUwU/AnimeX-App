name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: Decode release keystore
        working-directory: AnimeX
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build APK (release)
        working-directory: AnimeX
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          API_GATE_URL: ${{ secrets.API_GATE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: gradle assembleRelease --stacktrace

      - name: Remove keystore
        if: always()
        working-directory: AnimeX
        run: rm -f app/release.keystore

      - uses: actions/upload-artifact@v7
        with:
          name: animex-release
          path: AnimeX/app/build/outputs/apk/release/*.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: AnimeX/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: true
