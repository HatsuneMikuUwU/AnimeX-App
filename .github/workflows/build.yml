name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: Write google-services.json (FCM)
        working-directory: AnimeX
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON not set: building without FCM push (WorkManager fallback only)"
          fi

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        working-directory: AnimeX
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Unit tests
        working-directory: AnimeX
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK (release)
        working-directory: AnimeX
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}
          API_GATE_URL: ${{ secrets.API_GATE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: gradle assembleRelease --stacktrace

      - name: Remove keystore and Firebase config
        if: always()
        working-directory: AnimeX
        run: rm -f app/release.keystore app/google-services.json

      - uses: actions/upload-artifact@v7
        with:
          name: animex-release
          path: AnimeX/app/build/outputs/apk/release/*.apk

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: AnimeX/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

      - name: Wait before sending FCM
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && env.FCM_PROJECT_ID != ''
        run: sleep 120

      - uses: actions/setup-python@v7
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && env.FCM_PROJECT_ID != ''
        with:
          python-version: '3.12'

      - name: Send FCM push notification
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && env.FCM_PROJECT_ID != ''
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_TYPE: app_update
          NEW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          pip install cryptography
          python3 .github/scripts/send_fcm.py
