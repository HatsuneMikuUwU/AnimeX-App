name: Format Code

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Format Kotlin
        run: ktlint --format "AnimeX/**/*.kt" "AnimeX/**/*.kts" || true

      - name: Format C++
        working-directory: AnimeX/app/src/main/cpp
        run: clang-format -i animex_core.h animex_core.cpp jni_bridge.cpp

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: format Kotlin with ktlint and C++ with clang-format"
            git push
          fi
